<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>덕후브 캘린더</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#444444}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; font-family: 'Noto Sans KR', sans-serif; color: #1A1A1A; overflow: hidden">

<div style="padding: 20px 20px 0; flex: 1; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 2px">
<button aria-label="이전 달" style="width: 40px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<h1 style="margin: 0; font-size: 20px; font-weight: 700">2026년 11월</h1>
<button aria-label="다음 달" style="width: 40px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
<button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #D9D9D9; background: #FFFFFF; font-size: 13px; font-family: inherit; color: #1A1A1A; display: flex; align-items: center; gap: 4px">구독 IP 전체<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>

<div style="display: flex; gap: 6px; margin: 12px 0 10px">
<button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: #333333; color: #FFFFFF; font-size: 12px; font-weight: 700; font-family: inherit">전체</button>
<button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #D9D9D9; background: #FFFFFF; color: #1A1A1A; font-size: 12px; font-family: inherit">예약 오픈</button>
<button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #D9D9D9; background: #FFFFFF; color: #1A1A1A; font-size: 12px; font-family: inherit">응모 마감</button>
<button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #D9D9D9; background: #FFFFFF; color: #1A1A1A; font-size: 12px; font-family: inherit">팝업·행사</button>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; color: #666666; padding-bottom: 4px">
<span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<button style="{{c.style}}">
<span style="{{c.numStyle}}">{{c.num}}</span>
<span style="{{c.dotStyle}}"></span>
</button>
</sc-for>
</div>

<div style="height: 1px; background: #E0E0E0; margin: 12px 0"></div>
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px">
<div style="font-size: 15px; font-weight: 700">11월 1일 (일) · 일정 2개</div>
<span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: #333333; color: #FFFFFF">D-DAY</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{events}}" as="e" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid #E0E0E0">
<div style="width: 46px; text-align: center; font-size: 14px; font-weight: 700">{{e.time}}</div>
<div style="flex: 1; min-width: 0">
<div style="font-size: 11px; color: #666666">{{e.ip}} · {{e.kind}}</div>
<div style="font-size: 14px; font-weight: 500">{{e.title}}</div>
</div>
<button aria-label="알림 켜짐" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: #F2F2F2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 003.4 0"></path></svg>
</button>
</div>
</sc-for>
</div>
</div>

<nav style="display: flex; justify-content: space-around; padding: 6px 4px 22px; border-top: 1px solid #E0E0E0; background: #FFFFFF">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" style="{{t.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
{{t.label}}
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = 1;
    const defs = [
      ['홈', 'W1-Home.dc.html', 'M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z'],
      ['캘린더', 'W4-Calendar.dc.html', 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4'],
      ['검색', 'W2-Search.dc.html', 'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-3.5-3.5'],
      ['마이페이지', 'W6-My.dc.html', 'M12 4a4 4 0 100 8 4 4 0 000-8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6']
    ];
    const tabs = defs.map(([label, href, d], i) => {
      const on = i === active;
      const color = on ? '#1A1A1A' : '#757575';
      return { label, href, d, color, style: 'width:72px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:11px;color:' + color + ';font-weight:' + (on ? '700' : '400') };
    });
    const busy = { 1: 2, 3: 1, 5: 1, 7: 1, 12: 2, 15: 1, 21: 1, 28: 3 };
    const cells = [];
    for (let n = 1; n <= 35; n++) {
      const inMonth = n <= 30;
      const sel = n === 1;
      const has = inMonth && busy[n];
      cells.push({
        num: inMonth ? n : '',
        style: 'height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;padding:0;font-family:inherit',
        numStyle: 'width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:14px;' + (sel ? 'background:#333333;color:#FFFFFF;font-weight:700' : 'color:#1A1A1A'),
        dotStyle: 'height:5px;border-radius:3px;background:' + (has ? '#1A1A1A' : 'transparent') + ';width:' + (has ? (busy[n] > 1 ? 14 : 5) : 5) + 'px'
      });
    }
    const events = [
      { time: '20:00', ip: '[IP A]', kind: '예약 오픈', title: '[팝업스토어 사전예약]' },
      { time: '22:00', ip: '[IP B]', kind: '예약 오픈', title: '[콜라보 카페 2차 예약]' }
    ];
    return { tabs, cells, events };
  }
}
</script>
</body>
</html>
