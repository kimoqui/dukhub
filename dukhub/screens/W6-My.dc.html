<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>덕후브 마이페이지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#444444}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; font-family: 'Noto Sans KR', sans-serif; color: #1A1A1A; overflow: hidden">

<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
<h1 style="margin: 0; padding: 24px 20px 12px; font-size: 20px; font-weight: 700">마이페이지</h1>

<div style="display: flex; align-items: center; gap: 14px; padding: 4px 20px 16px">
<div style="width: 64px; height: 64px; border-radius: 32px; background: #E0E0E0; display: flex; align-items: center; justify-content: center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
</div>
<div style="flex: 1">
<div style="font-size: 17px; font-weight: 700">[닉네임]</div>
<div style="font-size: 13px; color: #666666">[이메일 또는 소셜 로그인 계정]</div>
</div>
<button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #D9D9D9; background: #FFFFFF; font-size: 13px; font-family: inherit; color: #1A1A1A">프로필 수정</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0 20px; border-radius: 14px; background: #F2F2F2; padding: 14px 0">
<a href="W3-Following.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #1A1A1A">
<span style="font-size: 20px; font-weight: 700">6</span><span style="font-size: 12px; color: #666666">구독 IP</span></a>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; border-left: 1px solid #D9D9D9; border-right: 1px solid #D9D9D9">
<span style="font-size: 20px; font-weight: 700">5</span><span style="font-size: 12px; color: #666666">예정 알림</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 20px; font-weight: 700">24</span><span style="font-size: 12px; color: #666666">받은 알림</span></div>
</div>

<div style="height: 8px; background: #F2F2F2; margin-top: 18px"></div>
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
<div style="padding: 16px 20px 4px; font-size: 13px; font-weight: 700; color: #666666">{{sec.title}}</div>
<sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="3">
<a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 50px; text-decoration: none; color: #1A1A1A">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#444444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg>
<span style="flex: 1; font-size: 15px">{{r.label}}</span>
<span style="font-size: 13px; color: #666666">{{r.meta}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
</sc-for>
<button style="margin: 8px 20px 0; height: 44px; border: 0; background: transparent; font-size: 13px; color: #666666; text-align: left; padding: 0; font-family: inherit">로그아웃</button>
</div>

<nav style="display: flex; justify-content: space-around; padding: 6px 4px 22px; border-top: 1px solid #E0E0E0; background: #FFFFFF">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" style="{{t.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
{{t.label}}
</a>
</sc-for>
</nav>
</div>
</x-dc>

</body>
</html>
