<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>덕후브 알림 설정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#444444}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; font-family: 'Noto Sans KR', sans-serif; color: #1A1A1A; overflow: hidden">

<header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 8px">
<a href="W6-My.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">알림 설정</h1>
</header>

<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: #F2F2F2">
<div>
<div style="font-size: 15px; font-weight: 700">푸시 알림 받기</div>
<div style="font-size: 12px; color: #666666">끄면 모든 덕후브 알림이 멈춰요</div>
</div>
<button aria-label="푸시 알림" aria-pressed="true" style="position: relative; width: 48px; height: 28px; border-radius: 14px; border: 0; padding: 0; background: #333333"><span style="position: absolute; top: 3px; left: 23px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></button>
</div>

<div style="padding: 18px 20px 6px; font-size: 13px; font-weight: 700; color: #666666">알림 시점 · 여러 개 선택 가능</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 0 20px">
<sc-for list="{{timings}}" as="t" hint-placeholder-count="4">
<button aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<div style="padding: 8px 20px 0; font-size: 12px; color: #666666">기본값은 오픈 30분 전이에요.</div>

<div style="padding: 20px 20px 4px; font-size: 13px; font-weight: 700; color: #666666">받을 알림 종류</div>
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid #EEEEEE">
<div>
<div style="font-size: 15px">{{k.label}}</div>
<div style="font-size: 12px; color: #666666">{{k.desc}}</div>
</div>
<button aria-label="{{k.label}}" aria-pressed="{{k.on}}" style="{{k.trackStyle}}"><span style="{{k.knobStyle}}"></span></button>
</div>
</sc-for>

<div style="padding: 20px 20px 4px; font-size: 13px; font-weight: 700; color: #666666">기타</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid #EEEEEE">
<div>
<div style="font-size: 15px">방해 금지 시간</div>
<div style="font-size: 12px; color: #666666">01:00 ~ 08:00 · 예약 오픈 알림은 예외</div>
</div>
<button aria-label="방해 금지 시간" aria-pressed="false" style="position: relative; width: 48px; height: 28px; border-radius: 14px; border: 0; padding: 0; background: #CCCCCC"><span style="position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></button>
</div>
<a href="W3-Following.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; text-decoration: none; color: #1A1A1A; border-bottom: 1px solid #EEEEEE">
<div>
<div style="font-size: 15px">IP별 알림 관리</div>
<div style="font-size: 12px; color: #666666">구독 중 6개 · 알림 켬 4개</div>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</div>

<nav style="display: flex; justify-content: space-around; padding: 6px 4px 22px; border-top: 1px solid #E0E0E0; background: #FFFFFF">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" style="{{t.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
{{t.label}}
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = 3;
    const defs = [
      ['홈', 'W1-Home.dc.html', 'M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z'],
      ['캘린더', 'W4-Calendar.dc.html', 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4'],
      ['검색', 'W2-Search.dc.html', 'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-3.5-3.5'],
      ['마이페이지', 'W6-My.dc.html', 'M12 4a4 4 0 100 8 4 4 0 000-8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6']
    ];
    const tabs = defs.map(([label, href, d], i) => {
      const on = i === active;
      const color = on ? '#1A1A1A' : '#757575';
      return { label, href, d, color, style: 'width:72px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:11px;color:' + color + ';font-weight:' + (on ? '700' : '400') };
    });
    const timings = [['하루 전', false], ['30분 전', true], ['10분 전', false], ['정각', true]].map(([label, on]) => ({
      label, on: on ? 'true' : 'false',
      style: 'height:44px;border-radius:10px;font-size:13px;font-family:inherit;' + (on ? 'background:#333333;color:#FFFFFF;border:0;font-weight:700' : 'background:#FFFFFF;color:#1A1A1A;border:1px solid #D9D9D9')
    }));
    const sw = (on) => ({
      trackStyle: 'position:relative;flex:none;width:48px;height:28px;border-radius:14px;border:0;padding:0;' + (on ? 'background:#333333' : 'background:#CCCCCC'),
      knobStyle: 'position:absolute;top:3px;width:22px;height:22px;border-radius:11px;background:#FFFFFF;' + (on ? 'left:23px' : 'left:3px')
    });
    const kinds = [
      ['예약 오픈', '굿즈·팝업·카페 예약이 열릴 때', true],
      ['응모 마감', '추첨·응모 마감이 다가올 때', true],
      ['팝업·행사 시작', '오프라인 행사 첫날', false],
      ['새 소식', '구독 IP의 공식 공지가 올라올 때', false]
    ].map(([label, desc, on]) => Object.assign({ label, desc, on: on ? 'true' : 'false' }, sw(on)));
    return { tabs, timings, kinds };
  }
}
</script>
</body>
</html>
