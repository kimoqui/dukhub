<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>덕후브 IP 검색</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#444444}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; font-family: 'Noto Sans KR', sans-serif; color: #1A1A1A; overflow: hidden">
<div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 14px; flex: 1; overflow: hidden">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">IP 검색</h1>
<label style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border-radius: 12px; background: #F2F2F2; border: 1.5px solid #1A1A1A">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">작품 검색</span>
<input type="text" placeholder="작품, 게임, 버튜버 이름" style="flex: 1; border: 0; outline: none; background: transparent; font-size: 15px; font-family: inherit; color: #1A1A1A">
</label>
<div style="display: flex; gap: 6px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<button style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
<div>
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px">
<span style="font-size: 14px; font-weight: 700">최근 검색</span>
<button style="height: 32px; border: 0; background: transparent; font-size: 12px; color: #666666; font-family: inherit">전체 삭제</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #D9D9D9; font-size: 13px">[검색어 1] <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
<span style="display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #D9D9D9; font-size: 13px">[검색어 2] <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
<span style="display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #D9D9D9; font-size: 13px">[검색어 3] <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
</div>
</div>
<div style="font-size: 14px; font-weight: 700">이번 주 오픈이 많은 IP</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{ips}}" as="ip" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #EEEEEE">
<span style="width: 24px; font-size: 14px; font-weight: 700; color: #666666; text-align: center">{{ip.rank}}</span>
<div style="width: 44px; height: 44px; border-radius: 10px; background: #E0E0E0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #444444">{{ip.i}}</div>
<div style="flex: 1">
<div style="font-size: 14px; font-weight: 500">{{ip.name}}</div>
<div style="font-size: 12px; color: #666666">{{ip.meta}}</div>
</div>
<button style="{{ip.btnStyle}}">{{ip.btn}}</button>
</div>
</sc-for>
</div>
</div>
<nav style="display: flex; justify-content: space-around; padding: 6px 4px 22px; border-top: 1px solid #E0E0E0; background: #FFFFFF">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="{{t.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
{{t.label}}
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = 2;
    const defs = [
      ['홈', 'W1-Home.dc.html', 'M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z'],
      ['캘린더', 'W4-Calendar.dc.html', 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4'],
      ['검색', 'W2-Search.dc.html', 'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-3.5-3.5'],
      ['마이페이지', 'W6-My.dc.html', 'M12 4a4 4 0 100 8 4 4 0 000-8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6']
    ];
    const tabs = defs.map(([label, href, d], i) => {
      const on = i === active;
      const color = on ? '#1A1A1A' : '#757575';
      return { label, href, d, color, style: 'width:64px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:11px;color:' + color + ';font-weight:' + (on ? '700' : '400') };
    });
    const cats = ['전체', '게임', '애니', '버튜버', '웹툰'].map((label, i) => ({
      label,
      style: 'height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-family:inherit;' + (i === 0 ? 'background:#333333;color:#FFFFFF;border:0;font-weight:700' : 'background:#FFFFFF;color:#1A1A1A;border:1px solid #D9D9D9')
    }));
    const raw = [
      ['A', '[IP A]', '게임 · 오픈 3건', true], ['B', '[IP B]', '버튜버 · 오픈 2건', true],
      ['E', '[IP E]', '애니 · 오픈 2건', false], ['F', '[IP F]', '게임 · 오픈 1건', false],
      ['G', '[IP G]', '웹툰 · 오픈 1건', false], ['H', '[IP H]', '애니 · 오픈 1건', false]
    ];
    const ips = raw.map(([i, name, meta, on], idx) => ({
      i, name, meta, rank: idx + 1,
      btn: on ? '구독 중' : '구독',
      btnStyle: 'height:36px;min-width:68px;padding:0 12px;border-radius:18px;font-size:13px;font-family:inherit;' + (on ? 'background:#FFFFFF;border:1px solid #D9D9D9;color:#666666' : 'background:#333333;border:0;color:#FFFFFF;font-weight:700')
    }));
    return { tabs, cats, ips };
  }
}
</script>
</body>
</html>
